<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números em Japonês - Aprendizado Interativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1 class="main-title">
                <span class="title-jp">数字</span>
                <span class="title-text">Números em Japonês</span>
            </h1>
            <p class="subtitle">Aprenda de forma interativa e divertida!</p>
        </header>

        <!-- Primeira Seção: Pronúncia Aleatória -->
        <section class="random-section">
            <div class="section-header">
                <h2>Desafio de Pronúncia</h2>
                <div class="streak-container">
                    <span class="streak-icon">🔥</span>
                    <span class="streak-text">Sequência: <strong id="scoreValue">0</strong></span>
                </div>
            </div>
            
            <div class="pronunciation-display">
                <div class="circle" id="pronunciation"></div>
            </div>
            
            <div class="input-group">
                <input type="number" id="userInput" placeholder="Digite o número (1-10)" aria-label="Digite sua resposta" />
                <button class="btn-primary" onclick="validateAnswer()">
                    <span class="btn-text">Verificar</span>
                    <span class="btn-icon">→</span>
                </button>
            </div>
            
            <div class="feedback-container">
                <p id="feedback" class="feedback"></p>
                <div id="scoreAnimation" class="scoreAnimation"></div>
            </div>
        </section>

        <!-- Segunda Seção: Fixação dos Números -->
        <section class="fixation-section" id="fixation-section">
            <div class="section-header">
                <h2>Tabela de Referência</h2>
                <button class="toggle-button" id="toggleButton" onclick="toggleFixation()">
                    <span id="toggleText">Ocultar</span>
                </button>
            </div>
            
            <div class="numbers-grid">
                <div class="number-card">
                    <div class="number-badge">1</div>
                    <p class="romaji">ICHI</p>
                    <p class="hiragana">いち</p>
                </div>
                <div class="number-card">
                    <div class="number-badge">2</div>
                    <p class="romaji">NI</p>
                    <p class="hiragana">に</p>
                </div>
                <div class="number-card">
                    <div class="number-badge">3</div>
                    <p class="romaji">SAN</p>
                    <p class="hiragana">さん</p>
                </div>
                <div class="number-card">
                    <div class="number-badge">4</div>
                    <p class="romaji">SHI</p>
                    <p class="hiragana">し</p>
                </div>
                <div class="number-card">
                    <div class="number-badge">5</div>
                    <p class="romaji">GO</p>
                    <p class="hiragana">ご</p>
                </div>
                <div class="number-card">
                    <div class="number-badge">6</div>
                    <p class="romaji">ROKU</p>
                    <p class="hiragana">ろく</p>
                </div>
                <div class="number-card">
                    <div class="number-badge">7</div>
                    <p class="romaji">SHICHI</p>
                    <p class="hiragana">しち</p>
                </div>
                <div class="number-card">
                    <div class="number-badge">8</div>
                    <p class="romaji">HACHI</p>
                    <p class="hiragana">はち</p>
                </div>
                <div class="number-card">
                    <div class="number-badge">9</div>
                    <p class="romaji">KYUU</p>
                    <p class="hiragana">きゅう</p>
                </div>
                <div class="number-card">
                    <div class="number-badge">10</div>
                    <p class="romaji">JUU</p>
                    <p class="hiragana">じゅう</p>
                </div>
            </div>
        </section>

        <footer class="app-footer">
            <p>Pratique diariamente e alcance a fluência! 🎌</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
